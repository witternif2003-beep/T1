name: Standalone App Build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/standalone-app.yml"
      - ".python-version"
      - "app/**"
  pull_request:
    paths:
      - ".github/workflows/standalone-app.yml"
      - ".python-version"
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.7"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  build:
    name: Verify and package Flask deployment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up latest stable Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "pip"
          cache-dependency-path: app/requirements.lock

      - name: Install locked runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.lock
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Audit dependency advisories
        run: python -m pip_audit -r app/requirements.lock --progress-spinner off

      - name: Print package license metadata
        run: |
          python - <<'PY'
          from importlib.metadata import metadata

          for package in ("Flask", "Flask-Cors", "Flask-SocketIO", "gunicorn", "simple-websocket"):
              meta = metadata(package)
              print(f"{package}: {meta.get('License') or meta.get('License-Expression') or 'license metadata not declared'}")
              for classifier in meta.get_all("Classifier", []):
                  if classifier.startswith("License"):
                      print(f"  {classifier}")
          PY

      - name: Compile Python sources
        run: python -m compileall app

      - name: Smoke test Flask API
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import tempfile

          data_dir = Path(tempfile.mkdtemp(prefix="anomaly-data-"))
          shutil.copyfile("app/data/anomaly_patterns.json", data_dir / "anomaly_patterns.json")
          (data_dir / "entities.json").write_text(
              json.dumps({"schema_version": "1.0", "updated_at": None, "entities": []}) + "\n",
              encoding="utf-8",
          )
          os.environ["APP_DATA_DIR"] = str(data_dir)

          from app.app import app, socketio

          client = app.test_client()
          for path in ("/", "/api/health", "/api/entities", "/api/patterns", "/api/scan", "/api/reports/latest", "/api/statistics", "/api/telemetry"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code, response.get_data(as_text=True))

          scan = client.get("/api/scan").get_json()
          assert scan["status"] == "success"
          assert scan["data_status"] == "no_verified_data_loaded"
          assert scan["count"] == 0

          bad = client.post("/api/entities", json={"entities": [{"id": "missing-required-fields"}]})
          assert bad.status_code == 400

          record = {
              "id": "verified:workflow-smoke",
              "name": "Workflow Verification Record",
              "category": "ci",
              "source": {"name": "GitHub Actions", "url": "https://github.com"},
              "observed_at": "2026-08-25T02:20:00Z",
              "metrics": {
                  "acceleration_index": 4.0,
                  "deviation_sigma": 6.0,
                  "source_confidence": 0.95,
                  "impact_score": 95,
              },
              "attributes": {
                  "case_note": "Verified public filing references $5M wire transfer offshore account and admin override at 38.8977N, 77.0365W.",
                  "technical_note": "SSH credential exposed during unauthorized access review.",
              },
              "tags": ["verified"],
          }
          created = client.post("/api/entities", json={"entities": [record]})
          assert created.status_code == 200
          scan = client.get("/api/scan").get_json()
          assert scan["summary"]["verified_entities"] == 1
          assert scan["anomalies"][0]["entity"]["id"] == "verified:workflow-smoke"
          assert scan["anomalies"][0]["forensic_vectors"]
          assert scan["anomalies"][0]["chain_of_custody_hash"]
          assert any(hit["vector_id"] == "FV-001" for hit in scan["anomalies"][0]["forensic_vectors"])
          assert any(hit["vector_id"] == "FV-012" for hit in scan["anomalies"][0]["forensic_vectors"])
          assert scan["anomalies"][0]["forensics"]["legal_reference_hints"]
          assert scan["anomalies"][0]["forensics"]["sar_screen"]["weighted_score"] >= scan["anomalies"][0]["score"]
          assert scan["anomalies"][0]["forensics"]["chain_of_custody"]["hash"] == scan["anomalies"][0]["chain_of_custody_hash"]

          anomaly_id = scan["anomalies"][0]["id"]
          report = client.get(f"/api/anomaly/{anomaly_id}")
          assert report.status_code == 200
          assert report.get_json()["report"]["id"] == anomaly_id

          socket_client = socketio.test_client(app)
          assert socket_client.is_connected()
          received = socket_client.get_received()
          assert any(event["name"] == "connection_status" for event in received), received
          socket_client.emit("subscribe_anomalies")
          received = socket_client.get_received()
          assert any(event["name"] == "anomaly_snapshot" for event in received), received
          assert any(event["name"] == "new_anomaly" for event in received), received
          socket_client.emit("request_scan")
          received = socket_client.get_received()
          assert any(event["name"] == "scan_result" for event in received), received
          socket_client.disconnect()
          PY

      - name: Validate Gunicorn entrypoint
        run: python -m gunicorn --check-config --chdir app app:app

      - name: Build deployment artifact
        run: |
          tar \
            --exclude="__pycache__" \
            --exclude="*.pyc" \
            -czf standalone-anomaly-app.tar.gz \
            -C app .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-anomaly-app
          path: standalone-anomaly-app.tar.gz
          if-no-files-found: error
